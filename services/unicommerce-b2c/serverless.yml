service: unicommerce-b2c

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 512
  timeout: 900
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS
    authorizers:
      dashboardCognitoJwt:
        type: jwt
        identitySource:
          - $request.header.Authorization
        issuerUrl:
          Fn::Sub: "https://cognito-idp.${AWS::Region}.amazonaws.com/${UnicommerceDashboardUserPool}"
        audience:
          - Ref: UnicommerceDashboardUserPoolClient
  iam:
    role:
      statements:
        # Unicommerce REST API credentials (base_url, username, password, facility_code).
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.ucApiParamName}
        # Failure alerts.
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        # SAP Service Layer + HANA — India entity. Profile (and therefore
        # SSM prefix) is keyed by stage, see custom.sapProfileByStage /
        # custom.currentSapPrefix below: "dev" stays on the TEST company
        # DB (/sap/india_test/*) forever. "prod" used to resolve to the
        # bare default /sap/* family, same as delivery-api -- but that
        # parameter was discovered 2026-08-12 to hold a TEST company
        # (TEST_KFL_11072026), not the real live one, and delivery-api
        # reads that exact same unstaged path with no separation of its
        # own. Rather than fix a parameter shared with another service
        # (and risk delivery-api-dev suddenly pointing at real prod data),
        # unicommerce-b2c now owns a dedicated profile (/sap/unicommerce/*)
        # with the correct company (KFL_LIVE) -- fully independent of
        # delivery-api and of whatever /sap/* ends up meaning for it.
        # Resource paths here are built from the same
        # custom.currentSapPrefix the environment vars below use, so IAM
        # and env always agree per-stage automatically — no manual
        # two-places-to-edit step at cutover.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSapPrefix}/hana_config
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSapPrefix}/hana_credentials
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSapPrefix}/sl_config
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSapPrefix}/credentials
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:PutParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSapPrefix}/b1_session
        # Unicommerce posting settings (channel/customer/tax/warehouse maps —
        # replaces the Frappe "Unicommerce Settings" doctype).
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.ucSettingsParamName}
        # Infra dashboard page: read-only introspection of this service's
        # own Lambdas/schedules/metrics -- no write actions, no other
        # service's resources. CloudWatch actions don't support
        # resource-level ARN scoping (AWS requires "*" for these), so
        # that one's left unscoped by necessity; Lambda/EventBridge are
        # scoped to this service+stage's own function/rule name prefix.
        - Effect: Allow
          Action:
            - lambda:GetFunctionConfiguration
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-*
        # ListRuleNamesByTarget enumerates across all rules to find which
        # ones target a given Lambda -- confirmed live 2026-08-20 that AWS
        # requires the IAM resource for this specific action to be the
        # literal "rule/*" (matching every rule account-wide), not a
        # name-prefixed pattern; a scoped resource here gets a silent
        # AccessDeniedException. DescribeRule takes an explicit rule name
        # in the request, so it can (and should) stay scoped normally.
        - Effect: Allow
          Action:
            - events:ListRuleNamesByTarget
          Resource:
            - arn:aws:events:${self:provider.region}:*:rule/*
        - Effect: Allow
          Action:
            - events:DescribeRule
          Resource:
            - arn:aws:events:${self:provider.region}:*:rule/${self:service}-${self:provider.stage}-*
        - Effect: Allow
          Action:
            - cloudwatch:GetMetricStatistics
          Resource: "*"
        # dashboard_handler's retry-invoices/retry-cn batch path hands off
        # to these two scheduled Lambdas (900s budget) instead of running
        # inline behind httpApi's 30s cap -- see handlers.py's
        # _invoke_retry_batch. Scoped to exactly these two functions.
        # NOT declared inline here -- see UnicommerceRetryInvokePolicy in
        # resources.Resources below for why (circular dependency: this
        # role is those functions' execution role, so a statement here
        # referencing their ARNs makes the role depend on the functions
        # while the functions depend on the role).
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
    # Stage-keyed DATABASE_URL (see custom.currentDatabaseUrl below):
    # DATABASE_URL is a single repo-wide secret shared by every service and
    # every stage -- "dev" keeps reading it unchanged (into its own
    # unicommerce_dev schema, via the search_path suffix below). "prod" gets
    # its own dedicated database (unicommerce_b2c_prod, created 2026-08-18,
    # same RDS instance, same pattern as amazon-us-b2c's AMZ_PROD_DATABASE_URL
    # split) via UC_PROD_DATABASE_URL, so unicommerce prod stops sharing a
    # database with amazon-us-b2c dev, delivery-api, and Walmart. Data
    # migrated via \copy with explicit column lists (NOT pg_dump -- the live
    # table's physical column order had drifted from sql/unicommerce_b2c.sql
    # after a later ALTER TABLE, which silently corrupts positional COPY);
    # verified with a full-table MD5 checksum on both sides post-migration.
    # Any stage not listed falls back to the shared DATABASE_URL.
    DATABASE_URL: ${self:custom.currentDatabaseUrl}${self:custom.currentDbSearchPathSuffix}
    UC_API_PARAM_NAME: ${self:custom.ucApiParamName}
    UC_SETTINGS_PARAM_NAME: ${self:custom.ucSettingsParamName}
    UC_ALERT_ADMIN_EMAIL: ${env:UC_ALERT_ADMIN_EMAIL, ''}
    UC_ALERT_FROM_EMAIL: ${env:UC_ALERT_FROM_EMAIL, ''}
    UC_SES_REGION: ${env:UC_SES_REGION, 'ap-south-1'}
    # Hard floor on order_date/parent-order_date below which nothing posts
    # to live SAP -- see unicommerce.constants.POSTING_CUTOFF_DATE.
    UC_POSTING_CUTOFF_DATE: ${env:UC_POSTING_CUTOFF_DATE, '2026-08-01'}
    # Stage-keyed profile — "dev" stays on india_test (/sap/india_test/*)
    # forever; "prod" resolves to "unicommerce" (/sap/unicommerce/*), its
    # own dedicated company DB (KFL_LIVE), independent of delivery-api's
    # /sap/* default. See custom.sapProfileByStage below — do NOT repoint
    # /sap/india_test/*'s values to the prod company DB; add a new
    # profile entry the same way instead if a third environment is ever
    # needed.
    SAP_SL_PROFILE: ${self:custom.currentSapProfile}
    HANA_PROFILE: ${self:custom.currentSapProfile}
    SAP_SL_USE_SSM: ${env:SAP_SL_USE_SSM, 'true'}
    # Stage-keyed, NOT the shared secrets.SAP_SL_VERIFY_SSL -- that same repo
    # secret also feeds amazon-us-b2c/B2C_Invoice, whose SAP hosts hold valid
    # CA certs. unicommerce prod's on-prem SAP B1 Service Layer box
    # (103.69.202.108:50000, /sap/unicommerce/sl_config) serves a self-signed
    # cert -- verify=true against it fails every login, silently, since the
    # 2026-08-18 13:07 IST /sap/unicommerce cutover (every scheduled
    # Fetch/PostInvoices/PostCreditNotes run since posted zero orders to SAP,
    # with no CloudWatch error because the handler swallows the exception
    # before it reaches the Lambda runtime). See custom.sapVerifySslByStage.
    SAP_SL_VERIFY_SSL: ${self:custom.currentSapVerifySsl}
    HANA_USE_SSM: ${env:HANA_USE_SSM, '1'}

custom:
  ucApiParamName: ${env:UC_API_PARAM_NAME, '/unicommerce/api_credentials'}
  ucSettingsParamName: ${env:UC_SETTINGS_PARAM_NAME, '/unicommerce/settings'}
  # Stage-keyed database URL -- only "prod" gets its own dedicated database
  # (UC_PROD_DATABASE_URL); every other stage keeps reading the shared
  # DATABASE_URL secret unchanged, same as every other service in this repo.
  # dev also gets its own least-privilege credential (UC_DEV_DATABASE_URL,
  # 2026-08-18): a role scoped to only the unicommerce_dev schema below, no
  # grants on public or any other service's tables in this shared database
  # -- replaces the previous shared superuser credential, which could read
  # every other service's data by virtue of being a superuser, not because
  # anything relied on it doing so.
  databaseUrlByStage:
    dev: ${env:UC_DEV_DATABASE_URL, env:DATABASE_URL, ''}
    prod: ${env:UC_PROD_DATABASE_URL, env:DATABASE_URL, ''}
  currentDatabaseUrl: ${self:custom.databaseUrlByStage.${self:provider.stage}, env:DATABASE_URL, ''}
  # Stage-keyed SAP/HANA profile -- "dev" stays isolated on the TEST
  # company DB forever; "prod" resolves to "unicommerce", its own
  # dedicated profile/company (KFL_LIVE) -- NOT the bare default /sap/*
  # family, which is shared with delivery-api and (as of 2026-08-12) was
  # found to hold a test company, not real production data. Any stage
  # not listed here (staging, one-off preview stages, etc.) falls back to
  # india_test, the safer default -- never silently defaults to touching
  # a real SAP session.
  sapProfileByStage:
    dev: india_test
    prod: unicommerce
  currentSapProfile: ${self:custom.sapProfileByStage.${self:provider.stage}, 'india_test'}
  sapPrefixByStage:
    dev: /sap/india_test
    prod: /sap/unicommerce
  currentSapPrefix: ${self:custom.sapPrefixByStage.${self:provider.stage}, '/sap/india_test'}
  # Scoped to unicommerce prod only -- do NOT flip the shared
  # secrets.SAP_SL_VERIFY_SSL repo secret for this, it also gates
  # amazon-us-b2c/B2C_Invoice's SAP hosts, which have valid CA certs and
  # must stay verified. dev keeps deferring to that shared secret (falls
  # back to 'true' if unset), matching every other env var in this file.
  sapVerifySslByStage:
    dev: ${env:SAP_SL_VERIFY_SSL, 'true'}
    prod: 'false'
  currentSapVerifySsl: ${self:custom.sapVerifySslByStage.${self:provider.stage}, 'true'}
  # Fetch/PostInvoices/PostCreditNotes crons must only ever run in prod.
  # Kept disabled in dev even after the schema split below as
  # defense-in-depth -- there is still no reason for dev to write
  # anything unattended. Any stage not listed here falls back to false,
  # the safe default.
  schedulesEnabledByStage:
    dev: false
    prod: true
  currentSchedulesEnabled: ${self:custom.schedulesEnabledByStage.${self:provider.stage}, false}
  # dev and prod share the one physical RDS instance/database
  # (khanal_serverless) -- there's no separate dev DB to point at. Real
  # isolation instead comes from a Postgres search_path: dev's connection
  # is pinned to the unicommerce_dev schema (tables built from
  # sql/unicommerce_b2c.sql, see 2026-08-18 fix), so unqualified table
  # names in dashboard_queries.py/store.py resolve to dev's own empty
  # copies instead of the shared database's rows. Prod gets an empty
  # suffix -- since the same 2026-08-18 change, prod's DATABASE_URL points
  # at its own dedicated database (unicommerce_b2c_prod) via
  # UC_PROD_DATABASE_URL above, so it never touches this shared database at
  # all; the suffix stays empty because prod's own database only has a
  # public schema, same as before. Fixes the 2026-08-17 incident where
  # dev's dashboard rendered identical rows to prod's, and the win-condition
  # where a dev cron claiming a shared 'ready' row would mark it 'posted'
  # with a DocEntry from dev's india_test SAP company instead of prod's
  # real KFL_LIVE posting.
  dbSearchPathSuffixByStage:
    dev: "?options=-c%20search_path%3Dunicommerce_dev"
    prod: ""
  currentDbSearchPathSuffix: ${self:custom.dbSearchPathSuffixByStage.${self:provider.stage}, ''}

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"
    - "!src/unicommerce/credentials_local.py"
    - "!**/__pycache__/**"
    - "!**/*.pyc"

functions:
  unicommerceFetch:
    handler: src.handlers.fetch_handler
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      # 30-min offset so future posting/credit-note/PO/inventory functions
      # (same cadence as the Frappe cron) don't collide — see
      # docs/migration/03-unicommerce-b2c.md's function table.
      # Enabled 2026-08-12: Frappe's own fetch_orders/fetch_returns crons
      # are still running (confirmed live via Scheduled Job Type
      # last_execution) -- dual-fetch is safe by design (read-only from
      # UC, writes to separate DBs), this is the documented dual-run step.
      - schedule:
          rate: cron(2,32 * * * ? *)
          enabled: ${self:custom.currentSchedulesEnabled}

  unicommercePostInvoices:
    handler: src.handlers.post_invoices_handler
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      # Same 30-min offset pattern as the Frappe cron (7,37 * * * *).
      # Enabled 2026-08-12: Frappe's own post_invoices cron confirmed
      # `stopped=1` since 2026-08-06 (Scheduled Job Type query) -- no
      # double-posting risk, this is now the only system posting invoices.
      - schedule:
          rate: cron(7,37 * * * ? *)
          enabled: ${self:custom.currentSchedulesEnabled}

  unicommercePostCreditNotes:
    handler: src.handlers.post_credit_notes_handler
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      # Same 30-min offset pattern as the Frappe cron (17,47 * * * *).
      # Enabled 2026-08-12: Frappe's own post_credit_notes cron was
      # confirmed running (last_execution minutes prior) then explicitly
      # stopped (`stopped=1`) immediately before this flip, same
      # back-to-back discipline as every other cutover here.
      - schedule:
          rate: cron(17,47 * * * ? *)
          enabled: ${self:custom.currentSchedulesEnabled}

  unicommercePoGrn:
    handler: src.handlers.pogrn_handler
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      # Same 30-min offset pattern as the other flows. Enabled 2026-08-20,
      # EC-FG only (see pogrn.ENABLED_TO_WAREHOUSES) -- Phase A dry-run and
      # a real Phase B write both ran against real SAP/UC data before this
      # flip. Phase B (DocEntry 23) was correctly rejected by UC on an
      # already-past batch expiry -- confirmed against khanal_tech_integrations'
      # legacy Frappe worker that this is real UC business-rule behavior,
      # not a bug (it never hit this either, only because it ran
      # continuously and never let a queued transfer's batch go stale).
      # AMZ-* facilities are permanently out of scope for PO/GRN (see
      # pogrn.watched_warehouses's docstring) -- not worth chasing UC
      # vendor-facility config for bookkeeping Amazon's own FBA network
      # never sees. Their invoice/credit-note routing (CHANNEL_WAREHOUSE_MAP
      # in sap_payload.py) is unaffected and unrelated to this.
      - schedule:
          rate: cron(22,52 * * * ? *)
          enabled: ${self:custom.currentSchedulesEnabled}

  unicommerceRecon:
    handler: src.handlers.recon_handler
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      # Same 30-min offset pattern as the other flows. Read-only against
      # SAP (only writes to our own Postgres), so unlike pogrn there's
      # no real-write risk gating this. Enabled 2026-08-20: manually
      # invoked against prod first (limit=5, 0 failures, 2 CN rows
      # refreshed cleanly) -- same "verify against the real source
      # system" discipline as every other cutover here.
      - schedule:
          rate: cron(27,57 * * * ? *)
          enabled: ${self:custom.currentSchedulesEnabled}

  unicommerceDashboardApi:
    handler: src.handlers.dashboard_handler
    memorySize: 512
    timeout: 30
    environment:
      # Targets for _invoke_retry_batch's async hand-off -- see
      # UnicommerceRetryInvokePolicy below for the matching IAM grant.
      POST_INVOICES_FUNCTION_ARN:
        Fn::GetAtt: [UnicommercePostInvoicesLambdaFunction, Arn]
      POST_CREDIT_NOTES_FUNCTION_ARN:
        Fn::GetAtt: [UnicommercePostCreditNotesLambdaFunction, Arn]
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      - httpApi: { path: /v1/unicommerce/stats, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/orders, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/order-detail, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/returns, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/sync-log, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/recon-gaps, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/retry-invoices, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/retry-cn, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/unicommerce/infra, method: get, authorizer: { name: dashboardCognitoJwt } }

resources:
  Resources:
    # dashboard_handler's retry-invoices/retry-cn hand-off needs
    # lambda:InvokeFunction scoped to exactly these two functions. Declared
    # as a standalone AWS::IAM::Policy (attached to the framework's default
    # execution role by name) instead of inline under provider.iam.role.statements
    # -- those two functions use that same role to execute, so an inline
    # statement referencing their ARNs makes the role depend on the
    # functions while the functions depend on the role, a circular
    # dependency CloudFormation refuses to deploy. A separate policy
    # resource only depends on the functions; nothing depends back on it.
    UnicommerceRetryInvokePolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: ${self:service}-${self:provider.stage}-retry-invoke
        Roles:
          - !Ref IamRoleLambdaExecution
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - Fn::GetAtt: [UnicommercePostInvoicesLambdaFunction, Arn]
                - Fn::GetAtt: [UnicommercePostCreditNotesLambdaFunction, Arn]

    UnicommerceDashboardUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-dashboard
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 10
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1

    UnicommerceDashboardUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-dashboard-web
        UserPoolId: !Ref UnicommerceDashboardUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders:
          - COGNITO

    # Static hosting for services/unicommerce-b2c/dashboard/ (React/Vite app,
    # built to dashboard/dist/) — private bucket, read only via CloudFront's
    # Origin Access Control (no public bucket policy, no website-hosting
    # endpoint). Build with `npm run build` in dashboard/, then push
    # dashboard/dist/ with `aws s3 sync` after deploy — not managed by this
    # stack.
    DashboardSiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-dashboard-site
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    DashboardOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-dashboard-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    DashboardDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          PriceClass: PriceClass_100
          Origins:
            - Id: dashboardS3Origin
              DomainName: !GetAtt DashboardSiteBucket.RegionalDomainName
              OriginAccessControlId: !Ref DashboardOriginAccessControl
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: dashboardS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed "CachingOptimized" policy.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

    DashboardBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref DashboardSiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${DashboardSiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  Outputs:
    UnicommerceDashboardUserPoolId:
      Description: Cognito User Pool ID for the Unicommerce dashboard login
      Value: !Ref UnicommerceDashboardUserPool
    UnicommerceDashboardUserPoolClientId:
      Description: Cognito app client ID for the Unicommerce dashboard login
      Value: !Ref UnicommerceDashboardUserPoolClient
    DashboardSiteBucketName:
      Description: S3 bucket to sync services/unicommerce-b2c/dashboard/ into
      Value: !Ref DashboardSiteBucket
    DashboardCloudFrontUrl:
      Description: Public URL for the Unicommerce dashboard
      Value: !Sub "https://${DashboardDistribution.DomainName}"
