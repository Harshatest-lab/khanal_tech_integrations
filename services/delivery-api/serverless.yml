service: delivery-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  # More vCPU during Init + handler; 512 MB noticeably slower for same code path.
  memorySize: 512
  timeout: 20
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: INFO
    # Set at deploy time (CI secrets / shell); never commit real values.
    DATABASE_URL: ${env:DATABASE_URL, ''}
    DELHIVERY_WEBHOOK_SECRET: ${env:DELHIVERY_WEBHOOK_SECRET, ''}
  httpApi:
    cors: true
  # VPC: khanal-db-dev in vpc-01450e83233d29d0c (see docs/LAMBDA_VPC_SETUP.md).
  vpc:
    securityGroupIds:
      - sg-054440547aa97218e   # delivery-api-lambda
    subnetIds:
      - subnet-0723a5f0183b06da4   # us-east-1a
      - subnet-0d282e4d768e260cb   # us-east-1d (same AZ as khanal-db-dev)

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"

functions:
  delhiveryShipmentStatusWebhook:
    handler: src.delhivery_webhook.handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/webhooks/delhivery/shipment-status
          method: post
  delhiveryPodWebhook:
    handler: src.delhivery_pod_webhook.handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/webhooks/delhivery/pod
          method: post
