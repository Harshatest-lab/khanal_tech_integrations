service: delivery-api

frameworkVersion: "3"

# Bump when changing REST API integrations/methods so API Gateway gets a new Deployment.
custom:
  delhiveryApiDeploymentVersion: 24
  # Default IAM + Lambda env bucket name (override with POD_S3_BUCKET at deploy).
  podS3BucketDefault: ${self:service}-${self:provider.stage}-delhivery-epod
  podS3Bucket: ${env:POD_S3_BUCKET, self:custom.podS3BucketDefault}

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 20
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: arn:aws:s3:::${self:custom.podS3Bucket}/*
        # Optional: SAP SL session + config in SSM when SAP_SL_USE_SSM=true (see docs/DELHIVERY.md).
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:PutParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/sl_config
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/credentials
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/b1_session
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: INFO
    DATABASE_URL: ${env:DATABASE_URL, ''}
    DELHIVERY_WEBHOOK_SECRET: ${env:DELHIVERY_WEBHOOK_SECRET, ''}
    # Dev only: when true/1/yes, worker does not enforce X-Delhivery-Webhook-Secret (public webhook URL — do not use in prod).
    DELHIVERY_SKIP_WEBHOOK_SECRET: ${env:DELHIVERY_SKIP_WEBHOOK_SECRET, 'false'}
    # When set, POD webhooks with base64 EPOD are decoded and stored in this bucket; DB keeps HTTPS pod_url only.
    POD_S3_BUCKET: ${self:custom.podS3Bucket}
    POD_S3_PREFIX: ${env:POD_S3_PREFIX, 'delhivery-pod'}
    # Optional: SAP B1 Service Layer — PATCH Invoices(DocEntry) with U_Pod_Link / U_POD_DATE / U_LRtrackno after POD insert.
    # When SAP_SL_USE_SSM is 1/true/yes, read base URL + credentials + session cache from SSM (/sap/sl_config, /sap/credentials, /sap/b1_session).
    SAP_SL_USE_SSM: ${env:SAP_SL_USE_SSM, ''}
    SAP_SL_BASE_URL: ${env:SAP_SL_BASE_URL, ''}
    SAP_SL_COMPANYDB: ${env:SAP_SL_COMPANYDB, ''}
    SAP_SL_USERNAME: ${env:SAP_SL_USERNAME, ''}
    SAP_SL_PASSWORD: ${env:SAP_SL_PASSWORD, ''}
    # When SAP Service Layer uses a self-signed TLS cert, set to false (dev only). Default verifies cert chain.
    SAP_SL_VERIFY_SSL: ${env:SAP_SL_VERIFY_SSL, 'true'}

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"

functions:
  # SQS → VPC → RDS (unchanged semantics; message body = raw Delhivery JSON + webhookKind in messageAttributes).
  delhiveryWebhookWorker:
    handler: src.delhivery_sqs_worker.handler
    memorySize: 512
    timeout: 30
    vpc:
      securityGroupIds:
        - sg-054440547aa97218e   # delivery-api-lambda
      subnetIds:
        - subnet-0723a5f0183b06da4   # us-east-1a (NAT — Lambda outbound / SAP)
        - subnet-0cced34950dc4ad65   # us-east-1b (NAT — Lambda HA; RDS stays in 1d on IGW)
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - sqs:
          arn: !GetAtt DelhiveryWebhookQueue.Arn
          batchSize: 1

resources:
  Resources:
    DelhiveryWebhookDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-delhivery-webhook-dlq
        MessageRetentionPeriod: 1209600

    DelhiveryWebhookQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-delhivery-webhook
        VisibilityTimeout: 90
        MessageRetentionPeriod: 345600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DelhiveryWebhookDlq.Arn
          maxReceiveCount: 5

    # --- REST API: POST → SQS SendMessage (no ingest Lambda) ---
    ApiGatewaySqsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-apigw-sqs-send
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: apigateway.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ApiGatewaySqsSendMessage
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: !GetAtt DelhiveryWebhookQueue.Arn

    DelhiveryRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: ${self:service}-${self:provider.stage}-delhivery-webhook
        EndpointConfiguration:
          Types:
            - REGIONAL
        Description: Delhivery webhooks → SQS (no Lambda on hot path)

    DelhiveryResourceV1:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ParentId: !GetAtt DelhiveryRestApi.RootResourceId
        PathPart: v1

    DelhiveryResourceWebhooks:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ParentId: !Ref DelhiveryResourceV1
        PathPart: webhooks

    DelhiveryResourceDelhivery:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ParentId: !Ref DelhiveryResourceWebhooks
        PathPart: delhivery

    DelhiveryResourceShipmentStatus:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ParentId: !Ref DelhiveryResourceDelhivery
        PathPart: shipment-status

    DelhiveryResourcePod:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ParentId: !Ref DelhiveryResourceDelhivery
        PathPart: pod

    DelhiveryMethodShipmentStatus:
      Type: AWS::ApiGateway::Method
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ResourceId: !Ref DelhiveryResourceShipmentStatus
        HttpMethod: POST
        AuthorizationType: NONE
        # false = optional header; declare so API Gateway exposes it to VTL ($input.params).
        RequestParameters:
          method.request.header.x-delhivery-webhook-secret: false
        Integration:
          Type: AWS
          IntegrationHttpMethod: POST
          PassthroughBehavior: NEVER
          Uri: !Sub arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${self:service}-${self:provider.stage}-delhivery-webhook
          Credentials: !GetAtt ApiGatewaySqsRole.Arn
          RequestParameters:
            integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
          # Single-line only: YAML |- injects leading newlines into the SQS form body. Omit webhookSecret when empty — SQS rejects empty String attribute values. Use raw $sec for MessageAttribute.2 (urlEncode on $sec breaks the form for SendMessage).
          RequestTemplates:
            application/json: "#set($encBody=$util.urlEncode($input.body))#set($sec=$input.params('x-delhivery-webhook-secret'))#set($msg='Action=SendMessage&Version=2012-11-05&MessageBody='+ $encBody +'&MessageAttribute.1.Name=webhookKind&MessageAttribute.1.Value.StringValue=shipment_status&MessageAttribute.1.Value.DataType=String')#if($sec && $sec != '')#set($msg=$msg+'&MessageAttribute.2.Name=webhookSecret&MessageAttribute.2.Value.StringValue='+$sec+'&MessageAttribute.2.Value.DataType=String')#end$msg"
          IntegrationResponses:
            # Tight error patterns only — broad "Code" substring matched SQS success JSON and broke invoke clients.
            - StatusCode: 502
              SelectionPattern: ".*(<ErrorResponse|\"__type\"|\"Code\":\\s*\").*"
              ResponseTemplates:
                application/json: '{"message":"SQS SendMessage failed","hint":"Check ApiGatewaySqsRole sqs:SendMessage and queue name"}'
            - StatusCode: 200
              ResponseTemplates:
                application/json: '{"ok":true}'
        MethodResponses:
          - StatusCode: 200
          - StatusCode: 502

    DelhiveryMethodPod:
      Type: AWS::ApiGateway::Method
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        ResourceId: !Ref DelhiveryResourcePod
        HttpMethod: POST
        AuthorizationType: NONE
        RequestParameters:
          method.request.header.x-delhivery-webhook-secret: false
        Integration:
          Type: AWS
          IntegrationHttpMethod: POST
          PassthroughBehavior: NEVER
          Uri: !Sub arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${self:service}-${self:provider.stage}-delhivery-webhook
          Credentials: !GetAtt ApiGatewaySqsRole.Arn
          RequestParameters:
            integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
          # Same VTL as shipment-status; webhookKind=pod. Raw $sec for MessageAttribute.2 (no urlEncode on secret).
          RequestTemplates:
            application/json: "#set($encBody=$util.urlEncode($input.body))#set($sec=$input.params('x-delhivery-webhook-secret'))#set($msg='Action=SendMessage&Version=2012-11-05&MessageBody='+ $encBody +'&MessageAttribute.1.Name=webhookKind&MessageAttribute.1.Value.StringValue=pod&MessageAttribute.1.Value.DataType=String')#if($sec && $sec != '')#set($msg=$msg+'&MessageAttribute.2.Name=webhookSecret&MessageAttribute.2.Value.StringValue='+$sec+'&MessageAttribute.2.Value.DataType=String')#end$msg"
          IntegrationResponses:
            - StatusCode: 502
              SelectionPattern: ".*(<ErrorResponse|\"__type\"|\"Code\":\\s*\").*"
              ResponseTemplates:
                application/json: '{"message":"SQS SendMessage failed","hint":"Check ApiGatewaySqsRole sqs:SendMessage and queue name"}'
            - StatusCode: 200
              ResponseTemplates:
                application/json: '{"ok":true}'
        MethodResponses:
          - StatusCode: 200
          - StatusCode: 502

    DelhiveryApiDeployment:
      Type: AWS::ApiGateway::Deployment
      DependsOn:
        - DelhiveryMethodShipmentStatus
        - DelhiveryMethodPod
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        Description: ${self:service}-${self:provider.stage}-sqs-v${self:custom.delhiveryApiDeploymentVersion}

    DelhiveryApiStage:
      Type: AWS::ApiGateway::Stage
      DependsOn:
        - DelhiveryApiDeployment
      Properties:
        RestApiId: !Ref DelhiveryRestApi
        DeploymentId: !Ref DelhiveryApiDeployment
        StageName: ${self:provider.stage}
        TracingEnabled: true

  Outputs:
    DelhiveryWebhookRestApiUrl:
      Description: Base invoke URL for Delhivery REST webhooks (append /v1/webhooks/delhivery/...)
      Value: !Sub https://${DelhiveryRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}
