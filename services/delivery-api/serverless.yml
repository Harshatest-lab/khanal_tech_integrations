service: delivery-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 20
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: INFO
    # Set at deploy time (CI secrets / shell); never commit real values.
    FRAPPE_INGEST_API_KEY: ${env:FRAPPE_INGEST_API_KEY, ''}
    DELHIVERY_WEBHOOK_SECRET: ${env:DELHIVERY_WEBHOOK_SECRET, ''}
  httpApi:
    cors: true

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"

functions:
  frappeDelhiveryTrackingSnapshot:
    handler: src.frappe_ingest.handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/integrations/frappe/delhivery-tracking-snapshot
          method: post
  delhiveryShipmentStatusWebhook:
    handler: src.delhivery_webhook.handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/webhooks/delhivery/shipment-status
          method: post
  delhiveryPodWebhook:
    handler: src.delhivery_pod_webhook.handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/webhooks/delhivery/pod
          method: post
