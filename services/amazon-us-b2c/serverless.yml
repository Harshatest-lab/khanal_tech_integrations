service: amazon-us-b2c

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 512
  timeout: 900
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - OPTIONS
    authorizers:
      dashboardCognitoJwt:
        type: jwt
        identitySource:
          - $request.header.Authorization
        issuerUrl:
          Fn::Sub: "https://cognito-idp.${AWS::Region}.amazonaws.com/${AmazonDashboardUserPool}"
        audience:
          - Ref: AmazonDashboardUserPoolClient
  iam:
    role:
      statements:
        # SP-API LWA credentials.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/amazon-us/lwa
        # SAP HANA read-only credentials (FEFO stock, GL, SKU map, recon).
        # Stage-keyed prefix (custom.currentHanaPrefix): "dev" reads
        # /sap/inc_amzn_test/hana_config, pointed at the KHANAL_INC_LIVE
        # schema — the same physical HANA server as prod (103.69.202.108),
        # same login, different schema — so FEFO stock/SKU-map/GL reads
        # match the same company dev actually posts invoices into via
        # SAP SL. Previously this was un-keyed and always read prod's
        # KF_INC_22012026 schema, which meant a fixed SKU-map write into
        # KHANAL_INC_LIVE's item master was invisible to fetch_amazon_sku_map
        # (different company database) — confirmed 2026-08-07 by writing
        # U_Amz_SKU on KHANAL_INC_LIVE and seeing zero effect on the
        # refreshed map until this split existed. "prod" resolves to the
        # shared /sap/inc/* Walmart already uses live, unchanged.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentHanaPrefix}/hana_config
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentHanaPrefix}/hana_credentials
        # SAP Service Layer config + login creds — read-only, the code never
        # writes these (only b1_session, below). Stage-keyed prefix
        # (custom.currentSlPrefix): "dev" resolves to /sap/inc_amzn_test/*,
        # which has no SSM params created yet on purpose — until a real
        # TEST-phase SAP company is wired up (see README "TEST phase"),
        # dev posting attempts fail loudly (ParameterNotFound -> alert
        # email) instead of silently posting to the live inc_amzn company
        # DB. "prod" resolves to /sap/inc_amzn/*, same as before this split.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSlPrefix}/sl_config
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSlPrefix}/credentials
        # This service's own SSM-cached B1 session; PutParameter for session
        # renewal + stale-session invalidation.
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:PutParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter${self:custom.currentSlPrefix}/b1_session
        # Failure alerts + recon summaries.
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        # MTR recon input/output files.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${self:custom.reconBucket}/*
        # Dashboard-triggered sync/post/recon buttons: amazonDashboardApi
        # fire-and-forget invokes these (API Gateway HTTP APIs hard-cap
        # integration timeout at 30s, so anything that can run long — order
        # sync, FBA sync, a full post/recon pass — must be handed off to its
        # own 900s-timeout function, never run in-process in the API
        # handler). Applied manually via `aws iam put-role-policy` first
        # (see amazon_us_b2c_dashboard_triggers memory) since a full
        # `serverless deploy` risks the env-var-wipe incident documented in
        # [[amazon-us-b2c-dev-stage-live-sap]] — this declaration is here so
        # a future clean deploy reproduces the same grant, not because it
        # was applied through one.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-amazonFetch
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-amazonFbaShipSync
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-amazonPostInvoices
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-amazonPostCreditNotes
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-amazonRecon
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
    # Stage-keyed DATABASE_URL (see custom.currentDatabaseUrl below):
    # DATABASE_URL is a single repo-wide secret shared by every service and
    # every stage -- "dev" and every other service must keep reading it
    # unchanged. "prod" gets its own dedicated database (amazon_us_b2c_prod,
    # created 2026-08-12, same RDS instance) via AMZ_PROD_DATABASE_URL, so
    # amazon-us-b2c prod stops silently reading/writing the shared dev
    # database its own bookkeeping never actually separated from before
    # this change (confirmed live 2026-08-13: prod's Lambdas had
    # current_database() = "khanal_serverless", not "amazon_us_b2c_prod",
    # despite that database existing with a real, untouched 28,419-order
    # backfill). Any stage not listed falls back to the shared DATABASE_URL,
    # unchanged from before this split.
    DATABASE_URL: ${self:custom.currentDatabaseUrl}
    # SAP SL profile, stage-keyed (see custom.currentSlProfile below):
    # "dev" stays on inc_amzn_test forever, so it can never touch the
    # live inc_amzn company DB; "prod" resolves to inc_amzn, the same
    # value this used unconditionally before this split. Own SL session
    # cache on purpose — a 401 here force-expires only this service's
    # session, not Walmart's. HANA is now also stage-keyed (see
    # custom.currentHanaProfile) so dev's reads and writes hit the same
    # company.
    SAP_SL_USE_SSM: ${env:SAP_SL_USE_SSM, 'true'}
    SAP_SL_VERIFY_SSL: ${env:SAP_SL_VERIFY_SSL, 'true'}
    SAP_SL_PROFILE: ${self:custom.currentSlProfile}
    HANA_USE_SSM: ${env:HANA_USE_SSM, '1'}
    HANA_PROFILE: ${self:custom.currentHanaProfile}
    AMZ_LWA_PARAM_NAME: ${env:AMZ_LWA_PARAM_NAME, '/amazon-us/lwa'}
    # Business config (defaults verified against production KF_INC_22012026).
    AMZ_POSTING_CUTOFF_DATE: ${env:AMZ_POSTING_CUTOFF_DATE, '2026-07-01'}
    AMZ_ALERT_ADMIN_EMAIL: ${env:AMZ_ALERT_ADMIN_EMAIL, ''}
    AMZ_ALERT_FROM_EMAIL: ${env:AMZ_ALERT_FROM_EMAIL, ''}
    AMZ_SES_REGION: ${env:AMZ_SES_REGION, 'ap-south-1'}
    AMZ_RECON_BUCKET: ${self:custom.reconBucket}

custom:
  reconBucket: ${env:AMZ_RECON_BUCKET, 'amazon-us-b2c-recon-${self:provider.stage}'}
  # Stage-keyed database URL -- only "prod" gets its own dedicated database
  # (AMZ_PROD_DATABASE_URL); every other stage keeps reading the shared
  # DATABASE_URL secret unchanged, same as every other service in this repo.
  databaseUrlByStage:
    prod: ${env:AMZ_PROD_DATABASE_URL, env:DATABASE_URL, ''}
  currentDatabaseUrl: ${self:custom.databaseUrlByStage.${self:provider.stage}, env:DATABASE_URL, ''}
  # Stage-keyed SAP Service Layer profile -- "dev" stays isolated on
  # inc_amzn_test forever (no SSM params created there yet on purpose,
  # so a dev posting attempt fails loudly instead of silently hitting
  # live SAP); "prod" resolves to inc_amzn, the same value this used
  # unconditionally before this split. Any stage not listed here falls
  # back to inc_amzn_test, the safer default -- never silently defaults
  # to touching the live company DB. Same pattern as unicommerce-b2c's
  # custom.sapProfileByStage.
  slProfileByStage:
    dev: inc_amzn_test
    prod: inc_amzn
  currentSlProfile: ${self:custom.slProfileByStage.${self:provider.stage}, 'inc_amzn_test'}
  slPrefixByStage:
    dev: /sap/inc_amzn_test
    prod: /sap/inc_amzn
  currentSlPrefix: ${self:custom.slPrefixByStage.${self:provider.stage}, '/sap/inc_amzn_test'}
  # Stage-keyed HANA profile -- "dev" reads /sap/inc_amzn_test/hana_config
  # (schema KHANAL_INC_LIVE, same physical HANA server + login as prod,
  # different schema); "prod" resolves to inc (schema KF_INC_22012026),
  # the same shared read-only profile Walmart already uses live,
  # unchanged from before this split.
  hanaProfileByStage:
    dev: inc_amzn_test
    prod: inc
  currentHanaProfile: ${self:custom.hanaProfileByStage.${self:provider.stage}, 'inc_amzn_test'}
  hanaPrefixByStage:
    dev: /sap/inc_amzn_test
    prod: /sap/inc
  currentHanaPrefix: ${self:custom.hanaPrefixByStage.${self:provider.stage}, '/sap/inc_amzn_test'}
  # Stage-keyed schedule enable flag -- "prod" runs live automation (TEST-SAP
  # pilot passed, see README "Cutover"); "dev" stays off on redeploy so a
  # `serverless deploy --stage dev` can never silently turn dev's schedules
  # back on. Any stage not listed here falls back to disabled, same
  # safe-default pattern as the SL/HANA profiles above.
  scheduleEnabledByStage:
    dev: false
    prod: true
  currentScheduleEnabled: ${self:custom.scheduleEnabledByStage.${self:provider.stage}, false}

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"
    - "!src/amazon_us/credentials_local.py"
    - "!**/__pycache__/**"
    - "!**/*.pyc"

functions:
  amazonFetch:
    handler: src.handlers.fetch_handler
    layers: [{ Ref: SharedLambdaLayer }]
    # EventBridge invokes async, so a timeout counts as failure and Lambda
    # auto-retries up to 2x by default -- confirmed live 2026-08-17 that a
    # stuck run's own retries (plus manual invokes) can stack multiple
    # concurrent callers onto the same thin SP-API quota and turn a slow
    # recovery into a two-hour outage. A stuck run should wait for its next
    # natural schedule, not get free concurrent shots at an API that's
    # already struggling -- same reasoning on every scheduled function
    # below. Applied manually via `aws lambda put-function-event-invoke-
    # config` first (a full `serverless deploy` risks the env-var-wipe
    # incident, see amazon_us_b2c_dashboard_triggers memory); declared
    # here so a future clean deploy reproduces the same setting.
    maximumRetryAttempts: 0
    events:
      # Hourly incremental (Orders API watermark). 15-20k orders/mo means
      # dozens of orders per run — the per-order item calls are fine.
      - schedule:
          rate: cron(10 * * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}
          input: { mode: incremental }
      # Daily bulk report with MTR lookback: self-heals anything the
      # incremental path missed. 20:15 UTC = 01:45 IST.
      - schedule:
          rate: cron(15 20 * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}
          input: { mode: report }

  amazonFbaShipSync:
    handler: src.handlers.fba_ship_sync_handler
    layers: [{ Ref: SharedLambdaLayer }]
    maximumRetryAttempts: 0  # see amazonFetch above
    events:
      # Daily, before invoice posting. 20:45 UTC = 02:15 IST.
      - schedule:
          rate: cron(45 20 * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}

  amazonPostInvoices:
    handler: src.handlers.post_invoices_handler
    layers: [{ Ref: SharedLambdaLayer }]
    maximumRetryAttempts: 0  # see amazonFetch above
    events:
      # Hourly during the working window; each run claims up to 200 ready
      # orders (~4 min at SAP's ~57 docs/min ceiling).
      - schedule:
          rate: cron(30 21-23,0-14 * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}
      # Daily retry safety net for transient failures (stock races).
      - schedule:
          rate: cron(0 3 * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}
          input: { mode: retry }

  amazonPostCreditNotes:
    handler: src.handlers.post_credit_notes_handler
    layers: [{ Ref: SharedLambdaLayer }]
    maximumRetryAttempts: 0  # see amazonFetch above
    events:
      # Every 6h with a 45-day window: Finances PostedDate lags the MTR,
      # and the duplicate guards make re-processing free.
      - schedule:
          rate: rate(6 hours)
          enabled: ${self:custom.currentScheduleEnabled}

  amazonRecon:
    handler: src.handlers.recon_handler
    layers: [{ Ref: SharedLambdaLayer }]
    maximumRetryAttempts: 0  # see amazonFetch above
    events:
      # Daily invariants after the posting window. 15:30 UTC = 21:00 IST.
      - schedule:
          rate: cron(30 15 * * ? *)
          enabled: ${self:custom.currentScheduleEnabled}
          input: { mode: invariants }

  amazonDashboardApi:
    handler: src.handlers.dashboard_handler
    memorySize: 512
    timeout: 30
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      - httpApi:
          path: /v1/amazon/stats
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/orders
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/order-detail
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/invoice-failures
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/cn-log
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/sync-log
          method: get
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/retry-invoices
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/retry-cn
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/recon-download
          method: get
          authorizer:
            name: dashboardCognitoJwt
      # Fire-and-forget triggers for the dashboard's sync/post/recon
      # buttons — see the lambda:InvokeFunction statement above.
      - httpApi:
          path: /v1/amazon/sync-orders
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/sync-fba
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/post-ready
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/run-recon
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/export-recon
          method: post
          authorizer:
            name: dashboardCognitoJwt
      - httpApi:
          path: /v1/amazon/export-finance-revenue
          method: post
          authorizer:
            name: dashboardCognitoJwt

resources:
  Resources:
    ReconBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.reconBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    AmazonDashboardUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-dashboard
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 10
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1

    AmazonDashboardUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-dashboard-web
        UserPoolId: !Ref AmazonDashboardUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders:
          - COGNITO
        AccessTokenValidity: 8
        IdTokenValidity: 8
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days

    # Static hosting for services/amazon-us-b2c/dashboard/ — private bucket,
    # read only via CloudFront's Origin Access Control (no public bucket
    # policy, no website-hosting endpoint). Content is pushed with
    # `aws s3 sync` after deploy, not managed by this stack. Same pattern
    # as unicommerce-b2c's DashboardSiteBucket.
    AmazonDashboardSiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-dashboard-site
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    AmazonDashboardOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-dashboard-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    AmazonDashboardDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          PriceClass: PriceClass_100
          Origins:
            - Id: dashboardS3Origin
              DomainName: !GetAtt AmazonDashboardSiteBucket.RegionalDomainName
              OriginAccessControlId: !Ref AmazonDashboardOriginAccessControl
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: dashboardS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed "CachingOptimized" policy.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

    AmazonDashboardBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref AmazonDashboardSiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${AmazonDashboardSiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AmazonDashboardDistribution}"

  Outputs:
    ReconBucketName:
      Value: !Ref ReconBucket
    AmazonDashboardUserPoolId:
      Description: Cognito User Pool ID for dashboard login
      Value: !Ref AmazonDashboardUserPool
    AmazonDashboardUserPoolClientId:
      Description: Cognito app client ID for dashboard login
      Value: !Ref AmazonDashboardUserPoolClient
    AmazonDashboardSiteBucketName:
      Description: S3 bucket to sync services/amazon-us-b2c/dashboard/ into
      Value: !Ref AmazonDashboardSiteBucket
    AmazonDashboardCloudFrontUrl:
      Description: Public URL for the Amazon US B2C dashboard
      Value: !Sub "https://${AmazonDashboardDistribution.DomainName}"
