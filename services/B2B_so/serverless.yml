service: b2b-so

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-south-1'}
  memorySize: 1024
  timeout: 900
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    authorizers:
      dashboardCognitoJwt:
        type: jwt
        identitySource:
          - $request.header.Authorization
        issuerUrl:
          Fn::Sub: "https://cognito-idp.${AWS::Region}.amazonaws.com/${B2BDashboardUserPool}"
        audience:
          - Ref: B2BDashboardUserPoolClient
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/b2b/imap
            - arn:aws:ssm:${self:provider.region}:*:parameter/b2b/blinkit/*
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/sl_config
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/credentials
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/hana_config
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/hana_credentials
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:PutParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/sap/b1_session
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${self:custom.docsBucket}/*
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-b2bBlinkitFetch
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:AdminDeleteUser
          Resource:
            - Fn::GetAtt: [B2BDashboardUserPool, Arn]
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
    DATABASE_URL: ${env:DATABASE_URL, ''}
    B2B_IMAP_PARAM_NAME: ${env:B2B_IMAP_PARAM_NAME, '/b2b/imap'}
    B2B_DOCS_BUCKET: ${self:custom.docsBucket}
    B2B_S3_PREFIX: blinkit
    B2B_MOVE_PROCESSED_MAIL: ${env:B2B_MOVE_PROCESSED_MAIL, 'true'}
    B2B_ALERT_ADMIN_EMAIL: ${env:B2B_ALERT_ADMIN_EMAIL, ''}
    B2B_ALERT_FROM_EMAIL: ${env:B2B_ALERT_FROM_EMAIL, ''}
    B2B_SES_REGION: ${env:B2B_SES_REGION, 'ap-south-1'}
    SAP_SL_USE_SSM: ${env:SAP_SL_USE_SSM, 'true'}
    SAP_SL_VERIFY_SSL: ${env:SAP_SL_VERIFY_SSL, 'true'}
    SAP_SL_PROFILE: ${env:SAP_SL_PROFILE, 'default'}
    HANA_USE_SSM: '1'
    COGNITO_USER_POOL_ID:
      Ref: B2BDashboardUserPool

custom:
  docsBucket: ${env:B2B_DOCS_BUCKET, 'khanal-b2b-so-${self:provider.stage}'}
  pythonRequirements:
    dockerizePip: false
    slim: true
    strip: false
    noDeploy:
      - boto3
      - botocore

plugins:
  - serverless-python-requirements

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "src/**"
    - "!src/b2b/credentials_local.py"
    - "!**/__pycache__/**"
    - "!**/*.pyc"

functions:
  b2bBlinkitFetch:
    handler: src.handlers.fetch_handler
    memorySize: 512
    timeout: 300
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: false

  b2bDashboardApi:
    handler: src.handlers.dashboard_handler
    memorySize: 512
    timeout: 29
    environment:
      B2B_FETCH_FUNCTION_NAME: ${self:service}-${self:provider.stage}-b2bBlinkitFetch
    layers: [{ Ref: SharedLambdaLayer }]
    events:
      - httpApi: { path: /v1/b2b/me, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/stats, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/orders, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/order-detail, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/amend-history, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/order, method: put, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/approve, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/reject, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/order-rematch, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/post-sap, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/update-sap, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/cancel-sap, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/fetch, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/notifications, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/notifications, method: delete, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/notifications/read, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/sku-map, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/sku-map, method: put, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/sku-map, method: delete, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/sku-map/import, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/sku-map/preview, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/ship-to, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/ship-to, method: put, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/ship-to, method: delete, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/ship-to/import, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/ship-to/preview, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/order-preview, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/order, method: delete, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/users, method: get, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/users, method: put, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/users, method: delete, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/users/status, method: post, authorizer: { name: dashboardCognitoJwt } }
      - httpApi: { path: /v1/b2b/logs, method: get, authorizer: { name: dashboardCognitoJwt } }

resources:
  Resources:
    B2BDocsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.docsBucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    B2BDocsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref B2BDocsBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadPoFiles
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: arn:aws:s3:::${self:custom.docsBucket}/*

    B2BDashboardUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}-dashboard
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 10
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT

    B2BDashboardUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-dashboard-web
        UserPoolId: !Ref B2BDashboardUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        SupportedIdentityProviders:
          - COGNITO

    B2BAdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: B2BAdmin
        Description: Full access including SKU map and IMAP fetch
        UserPoolId: !Ref B2BDashboardUserPool

    B2BReviewerGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: B2BReviewer
        Description: Approve POs and post to SAP
        UserPoolId: !Ref B2BDashboardUserPool

    B2BViewerGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: B2BViewer
        Description: Read-only
        UserPoolId: !Ref B2BDashboardUserPool

    B2BDeliveryGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: B2BDelivery
        Description: Logistics delivery portal (bootstrap; per-user perm_delivery in DB)
        UserPoolId: !Ref B2BDashboardUserPool

    B2BDashboardSiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${self:provider.stage}-dashboard-site
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    B2BDashboardOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${self:provider.stage}-dashboard-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    B2BDashboardDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          PriceClass: PriceClass_100
          Origins:
            - Id: dashboardS3Origin
              DomainName: !GetAtt B2BDashboardSiteBucket.RegionalDomainName
              OriginAccessControlId: !Ref B2BDashboardOAC
              S3OriginConfig:
                OriginAccessIdentity: ""
          DefaultCacheBehavior:
            TargetOriginId: dashboardS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

    B2BDashboardBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref B2BDashboardSiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${B2BDashboardSiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${B2BDashboardDistribution}"

  Outputs:
    B2BDashboardUserPoolId:
      Value: !Ref B2BDashboardUserPool
      Export:
        Name: ${self:service}-${self:provider.stage}-DashboardUserPoolId
    B2BDashboardUserPoolClientId:
      Value: !Ref B2BDashboardUserPoolClient
      Export:
        Name: ${self:service}-${self:provider.stage}-DashboardUserPoolClientId
    B2BDocsBucketName:
      Value: !Ref B2BDocsBucket
    B2BDashboardSiteBucketName:
      Value: !Ref B2BDashboardSiteBucket
    B2BDashboardCloudFrontUrl:
      Value: !Sub "https://${B2BDashboardDistribution.DomainName}"
