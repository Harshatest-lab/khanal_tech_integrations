service: dogseeus-invoice

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 20
  environment:
    STAGE: ${self:provider.stage}
    LOG_LEVEL: INFO
  httpApi:
    cors: true

layers:
  shared:
    name: ${self:service}-${self:provider.stage}-shared
    path: ../../layers/build
    package:
      patterns:
        - "python/**"
    compatibleRuntimes:
      - python3.12

package:
  patterns:
    - "!**"
    - "dogseeus_invoice/**"

functions:
  health:
    handler: dogseeus_invoice.handler.health_handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/dogseeus/health
          method: get
  invoice:
    handler: dogseeus_invoice.handler.invoice_handler
    layers:
      - { Ref: SharedLambdaLayer }
    events:
      - httpApi:
          path: /v1/dogseeus/invoices
          method: post
