name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml

      - name: Install shared package
        run: pip install -e "./shared[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Build shared Lambda layer
        run: bash scripts/build_shared_layer.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Serverless package (delivery-api)
        working-directory: services/delivery-api
        env:
          # Placeholders for `serverless package` only (not validated against AWS).
          LAMBDA_VPC_SECURITY_GROUP_ID: sg-0123456789abcdef
          LAMBDA_VPC_SUBNET_ID_1: subnet-0123456789abcdef0
          LAMBDA_VPC_SUBNET_ID_2: subnet-0123456789abcdef1
        run: |
          npm install
          npx serverless package --stage dev

      - name: Serverless package (dogseeus-invoice)
        working-directory: services/dogseeus-invoice
        run: |
          npm install
          npx serverless package --stage dev

      - name: Serverless package (B2C_Invoice)
        working-directory: services/B2C_Invoice
        run: |
          npm install
          npx serverless package --stage dev

      - name: Serverless package (amazon-us-b2c)
        working-directory: services/amazon-us-b2c
        run: |
          npm install
          npx serverless package --stage dev

      - name: Serverless package (unicommerce-b2c)
        working-directory: services/unicommerce-b2c
        run: |
          npm install
          npx serverless package --stage dev
