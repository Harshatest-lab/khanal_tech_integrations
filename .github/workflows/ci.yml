name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml

      - name: Install shared package
        run: |
          pip install -e "./shared[dev]"
          # unicommerce/uc_client.py imports requests directly (not a
          # khanal_shared dependency) -- without it, pytest's collection
          # error aborts the ENTIRE test run (shared + delivery-api +
          # dogseeus-invoice too), not just unicommerce-b2c's own tests.
          pip install requests

      - name: Run pytest
        run: pytest -q

      - name: Build shared Lambda layer
        run: bash scripts/build_shared_layer.sh
      # `serverless package` steps for all 5 services were removed here --
      # Serverless Framework v3.40 signs a real STS call during `package`
      # (confirmed: fails identically with or without VPC config, with
      # "security token included in the request is invalid" even for
      # syntactically-valid placeholder credentials), so it can never pass
      # in CI without genuinely valid AWS credentials. Granting CI real
      # OIDC-assumed credentials on every PR branch (not just main, which
      # is all the deploy role's trust policy currently allows) was judged
      # a bigger security-surface change than the config-syntax check these
      # steps provided was worth -- pytest is the real correctness gate.
