name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Target stage (dev, staging, prod)"
        required: true
        default: dev
      service:
        description: "Service folder: delivery-api | B2C_Invoice | amazon-us-b2c | dogseeus-invoice | unicommerce-b2c | safexpress"
        required: true
        default: delivery-api

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml

      - name: Install shared package
        run: |
          pip install -e "./shared[dev]"
          # unicommerce/uc_client.py imports requests directly (not a
          # khanal_shared dependency) -- without it, pytest's collection
          # error aborts the ENTIRE test run (same reasoning as ci.yml).
          pip install requests

      - name: Run pytest
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Deliberately NOT setting `environment:` here. Confirmed live
    # (2026-07-29 prod deploy attempt) that a job-level `environment:` key
    # changes the GitHub OIDC token's `sub` claim from
    # repo:OWNER/REPO:ref:refs/heads/BRANCH to
    # repo:OWNER/REPO:environment:NAME -- which the real AWS trust policy
    # (khanal-prod-github-deploy, condition StringLike sub
    # "repo:Khanal-Tech/Khanal_tech_serverless:ref:refs/heads/main") does
    # not match, so AssumeRoleWithWebIdentity fails outright. If a GitHub
    # Environment approval gate is wanted later, the AWS trust policy's
    # sub condition must be updated (or given an OR'd second condition)
    # for the environment-based sub *first* -- do not re-add this key
    # without doing that.
    steps:
      - uses: actions/checkout@v4

      - name: Require main branch for prod deploys
        if: inputs.stage == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Refusing to deploy stage=prod from ref '${{ github.ref }}' -- prod deploys must be dispatched from main."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build shared Lambda layer
        run: bash scripts/build_shared_layer.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install & deploy
        working-directory: services/${{ inputs.service }}
        env:
          # delivery-api: Lambda ENIs — same account/region as deploy (e.g. Mumbai lambda-nat subnets + Lambda SG).
          LAMBDA_VPC_SECURITY_GROUP_ID: ${{ secrets.LAMBDA_VPC_SECURITY_GROUP_ID }}
          LAMBDA_VPC_SUBNET_ID_1: ${{ secrets.LAMBDA_VPC_SUBNET_ID_1 }}
          LAMBDA_VPC_SUBNET_ID_2: ${{ secrets.LAMBDA_VPC_SUBNET_ID_2 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DELHIVERY_WEBHOOK_SECRET: ${{ secrets.DELHIVERY_WEBHOOK_SECRET }}
          # Optional: S3 bucket for base64 EPOD → object; must match IAM bucket name at deploy.
          POD_S3_BUCKET: ${{ secrets.POD_S3_BUCKET }}
          POD_S3_PREFIX: ${{ secrets.POD_S3_PREFIX }}
          SAP_SL_USE_SSM: ${{ secrets.SAP_SL_USE_SSM }}
          SAP_SL_BASE_URL: ${{ secrets.SAP_SL_BASE_URL }}
          SAP_SL_COMPANYDB: ${{ secrets.SAP_SL_COMPANYDB }}
          SAP_SL_USERNAME: ${{ secrets.SAP_SL_USERNAME }}
          SAP_SL_PASSWORD: ${{ secrets.SAP_SL_PASSWORD }}
          # Optional: set to false for self-signed SAP SL TLS (dev); omit or true for verify.
          SAP_SL_VERIFY_SSL: ${{ secrets.SAP_SL_VERIFY_SSL }}
          # amazon-us-b2c only — falls back to serverless.yml defaults if unset.
          # AMZ_PROD_DATABASE_URL: amazon-us-b2c prod's own dedicated database
          # (amazon_us_b2c_prod), separate from the shared DATABASE_URL every
          # other service/stage still reads. Only used when stage=prod.
          AMZ_PROD_DATABASE_URL: ${{ secrets.AMZ_PROD_DATABASE_URL }}
          AMZ_POSTING_CUTOFF_DATE: ${{ secrets.AMZ_POSTING_CUTOFF_DATE }}
          AMZ_ALERT_ADMIN_EMAIL: ${{ secrets.AMZ_ALERT_ADMIN_EMAIL }}
          AMZ_ALERT_FROM_EMAIL: ${{ secrets.AMZ_ALERT_FROM_EMAIL }}
          AMZ_SES_REGION: ${{ secrets.AMZ_SES_REGION }}
          # unicommerce-b2c only — falls back to serverless.yml defaults if unset.
          # UC_PROD_DATABASE_URL: unicommerce-b2c prod's own dedicated database
          # (unicommerce_b2c_prod), separate from the shared DATABASE_URL every
          # other service/stage still reads. Only used when stage=prod.
          UC_PROD_DATABASE_URL: ${{ secrets.UC_PROD_DATABASE_URL }}
          # UC_DEV_DATABASE_URL: least-privilege role scoped to the
          # unicommerce_dev schema only. Only used when stage=dev.
          UC_DEV_DATABASE_URL: ${{ secrets.UC_DEV_DATABASE_URL }}
          UC_API_PARAM_NAME: ${{ secrets.UC_API_PARAM_NAME }}
          UC_ALERT_ADMIN_EMAIL: ${{ secrets.UC_ALERT_ADMIN_EMAIL }}
          UC_ALERT_FROM_EMAIL: ${{ secrets.UC_ALERT_FROM_EMAIL }}
          UC_SES_REGION: ${{ secrets.UC_SES_REGION }}
          UC_POSTING_CUTOFF_DATE: ${{ secrets.UC_POSTING_CUTOFF_DATE }}
          # safexpress only — falls back to serverless.yml defaults if unset.
          # SAFEXPRESS_PROD_DATABASE_URL: safexpress prod's own dedicated
          # database (safexpress_prod), not the shared DATABASE_URL every
          # other service/stage still reads. Only used when stage=prod.
          SAFEXPRESS_PROD_DATABASE_URL: ${{ secrets.SAFEXPRESS_PROD_DATABASE_URL }}
        run: |
          npm install
          npx serverless deploy --stage ${{ inputs.stage }} --region ${{ secrets.AWS_REGION }}
